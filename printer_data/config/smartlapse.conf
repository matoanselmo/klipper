# smartlapse: picks the best camera frame of every layer (nozzle farthest from
# the camera) and drops it in the timelapse plugin's frame folder.
# Service: ~/smartlapse/smartlapse.py  Log: ~/printer_data/logs/smartlapse.log
# Restart the smartlapse service after editing.

[smartlapse]
stream_url: http://127.0.0.1:8080/?action=stream
frame_path: /tmp/timelapse/

# Camera sits on the right end of the Z gantry looking left, so a low X means
# the nozzle is far away.  Score = (camera_x - X) - y_weight*|Y - y_ref| - speed_weight*speed
camera_x: 200
# y_ref is the centre of the printed objects (EXCLUDE_OBJECT_DEFINE); this is the fallback
y_ref_default: 65
y_weight: 1.0
speed_weight: 0.0

sample_fps: 10
# Seconds added to the camera capture timestamp (measured -0.08 on 2026-10-11 by sweeping X)
latency_offset: -0.08
min_layer_step: 0.05
debug: false
