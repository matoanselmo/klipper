[include mainsail.cfg]
[include macros.cfg]
[include leds.cfg]
[include KAMP_Settings.cfg]

[include probe_offsets.cfg]
[include speed_test.cfg]
[include dryer.cfg]

[exclude_object]

[mcu]
canbus_uuid=efd592e09dd8

[mcu ebb]
canbus_uuid=69f9e88e88cc

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 6000
max_z_velocity: 15
max_z_accel: 100

[force_move]
enable_force_move: True

# Idle: heaters off, release X/Y/E only (M84 is Z-safe, see macros.cfg).
[idle_timeout]
timeout: 600
gcode:
    TURN_OFF_HEATERS
    M84

[temperature_sensor dp5_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor ebb_mcu]
sensor_type: temperature_mcu
sensor_mcu: ebb

[temperature_sensor dryer]
sensor_type: Generic 3950
sensor_pin: PC1       # Replace with your actual micro-controller pin
min_temp: -273.15
max_temp: 200

[adxl345]
cs_pin: ebb:PB12
spi_software_sclk_pin: ebb:PB10
spi_software_mosi_pin: ebb:PB11
spi_software_miso_pin: ebb:PB2
axes_map: x, z, -y   # board upright on back of toolhead, USB-C up (measured)

# ---------------- RESONANCE TESTER ----------------
# Toolhead ADXL only measures X (bed-slinger); Y needs a bed-mounted chip.
[resonance_tester]
accel_chip: adxl345
probe_points: 90, 50, 20   # centre of travel, 20 mm up

# ---------------- X AXIS (sensorless homing, negative direction) ----------------
[stepper_x]
step_pin: PC15
dir_pin: !PC14
enable_pin: !PC2
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5
position_max: 185
position_endstop: -5
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.58
sense_resistor: 0.110
diag_pin: PB4
driver_SGTHRS: 100
stealthchop_threshold: 999999

# ---------------- Y AXIS (physical endstop) ----------------
[stepper_y]
step_pin: PA1
dir_pin: !PA0
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PD2
position_endstop: -50
position_min: -50
position_max: 180
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PC3
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 999999

# ---------------- Z AXIS ----------------
[stepper_z]
step_pin: PA5
dir_pin: PA4
enable_pin: !PA6
microsteps: 64
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 150
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PA3
interpolate: False
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PC5
dir_pin: !PC4
enable_pin: !PB0
microsteps: 64
rotation_distance: 40

[tmc2209 stepper_z1]
uart_pin: PA7
interpolate: False
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 999999

# ---------------- EXTRUDER ----------------
[extruder]
step_pin: ebb:PD0
dir_pin: !ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.52245
max_extrude_only_distance: 800
max_extrude_cross_section: 5
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.7
gear_ratio: 50:17
heater_pin: ebb:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: ebb:PA3
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[tmc2209 extruder]
uart_pin: ebb:PA15
interpolate: False
run_current: 0.8
sense_resistor: 0.110
driver_IHOLDDELAY: 8
stealthchop_threshold: 10

# ---------------- RETRACTION ----------------
[firmware_retraction]
retract_length: 4
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

# ---------------- RUNOUT ----------------
[filament_switch_sensor runout_sensor]
pause_on_runout: True
runout_gcode:
    M117 Filament runout detected!
insert_gcode:
    M117 Filament inserted
event_delay: 3.0
pause_delay: 0.5
switch_pin: ^PB3


# ---------------- Z TILT ADJUST -------------------
[z_tilt]
z_positions:
    260, 45
    -30, 45
points:
    20, 95
    170, 95
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0300

# ---------------- BED HEATER ----------------
[heater_bed]
heater_pin: PC6
sensor_type: Generic 3950
sensor_pin: PC0
#control: pid
#pid_kp: 60
#pid_ki: 2
#pid_kd: 300
min_temp: 0
max_temp: 120

# ---------------- FANS ----------------
[fan]
pin: ebb:PA1
kick_start_time: 0.100
off_below: 0.15

[heater_fan hotend_fan]
pin: ebb:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[controller_fan controller_fan]
pin: PC9
kick_start_time: 0.25
fan_speed: 0.25
idle_timeout: 60
idle_speed: 0.0
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, extruder


# ---------------- PROBE ----------------
[bltouch]
sensor_pin: ^ebb:PB8
control_pin: ebb:PB9
x_offset: -42
y_offset: 0
#z_offset: 0

# ---------------- HOME -----------------
# Replaces safe_z_home (the two can't coexist): same Z hop / XY position /
# speeds, plus reduced current and a stall-flag pause for sensorless X.
[homing_override]
axes: xyz
gcode:
    {% set home_cur = 0.45 %}
    {% set run_cur = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set do_x = home_all or 'X' in params %}
    {% set do_y = home_all or 'Y' in params %}
    {% set do_z = home_all or 'Z' in params %}
    {% set x_ok = do_x or 'x' in homed %}
    {% set y_ok = do_y or 'y' in homed %}

    {% if do_z and not (x_ok and y_ok) %}
        { action_raise_error("Home X and Y before homing Z") }
    {% endif %}

    # Z hop (only fake the position if Z isn't homed yet)
    {% if 'z' not in homed %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=z
        G91
        G1 Z10 F900
        G90
        SET_KINEMATIC_POSITION SET_HOMED=none CLEAR_HOMED=z
    {% elif printer.toolhead.position.z < 10 %}
        G90
        G1 Z10 F900
    {% endif %}

    {% if do_x %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
        G28 X
        G90
        G1 X10 F6000
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_cur}
    {% endif %}

    {% if do_y %}
        G28 Y
    {% endif %}

    {% if do_z %}
        G90
        G1 X120 Y95 F12000
        G28 Z
        G1 Z10 F900
    {% endif %}

    {% if x_ok and y_ok %}
        G90
        G1 X78 Y95 F12000
    {% endif %}

# ---------------- BED MESH -------------------
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 20
mesh_max: 127, 180
probe_count: 10, 10
adaptive_margin: 5
algorithm: bicubic
fade_start: 1
fade_end: 10

[include KAMP_Settings.cfg]

