[output_pin case_light]
pin: PC8           # Use PC9 if using FAN1, or PC8 if using FAN0
pwm: True
cycle_time: 0.010  # 100Hz frequency to ensure flicker-free dimming
value: 0.5         # Boots up at 50% brightness
shutdown_value: 0  # Safety feature: turns light off if Klipper crashes

[neopixel drivers]
pin: PB7
chain_count: 25
color_order: GRB
initial_RED: 0.2
initial_GREEN: 0.0
initial_BLUE: 0.2

[led_effect drivers_idle]
autostart: true
frame_rate: 1
leds:
    neopixel:drivers
layers:
    static 6 0 top (0.2, 0.0, 0.2)

[led_effect drivers_heating_extruder]
autostart: false
frame_rate: 10
leds:
    neopixel:drivers
heater: extruder
layers:
    heater 25 0 add (0.2, 0.0, 0.0), (0.2, 0.2, 0.0)

[led_effect drivers_heating_bed]
autostart: false
frame_rate: 10
leds:
    neopixel:drivers
heater: heater_bed
layers:
    heater 25 0 add (0.2, 0.0, 0.0), (0.2, 0.2, 0.0)

[led_effect drivers_progress]
autostart: false
frame_rate: 10
leds:
    neopixel:drivers
layers:
    progress -1 0 add (0.0, 0.1, 0.2), (0.0, 0.02, 0.06)
    static 0 0 top (0.0, 0.0, 0.01)

[led_effect drivers_loading]
autostart: false
frame_rate: 12
leds:
    neopixel:drivers
layers:
    breathing 2 0 top (0.2, 0.0, 0.2)

[led_effect drivers_complete]
autostart: false
frame_rate: 10
leds:
    neopixel:drivers
layers:
    blink 1.5 0.5 top (0.0, 0.2, 0.0)
