# ---------------- X AXIS (sensorless homing, negative direction) ----------------
# Homing current, passes and idle current live in macros/_settings.cfg.

[stepper_x]
step_pin: PC15
dir_pin: !PC14
enable_pin: !PC2
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5
position_max: 185
position_endstop: -5
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.58
sense_resistor: 0.110
diag_pin: PB4
driver_SGTHRS: 100
stealthchop_threshold: 999999
