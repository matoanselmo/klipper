# ---------------- FANS ----------------

[fan]
pin: ebb:PA0
kick_start_time: 0.100
min_power: 0.15

[heater_fan hotend_fan]
pin: ebb:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 0.0

[controller_fan controller_fan]
pin: PC9
kick_start_time: 0
fan_speed: 0.6
idle_timeout: 60
idle_speed: 0.0
# Z is always energised (gantry hold), so its drivers always need airflow
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, extruder
