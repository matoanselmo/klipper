# ---------------- Y AXIS (sensorless homing, negative direction) ----------------
# Homing current and passes live in macros/_settings.cfg.

[stepper_y]
step_pin: PA1
dir_pin: !PA0
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -50
position_min: -50
position_max: 180
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC3
run_current: 1.2
sense_resistor: 0.110
diag_pin: ^PB3
driver_SGTHRS: 50
stealthchop_threshold: 999999
