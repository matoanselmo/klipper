# ---------------- Z AXIS (dual motor, belted, probe homing) ----------------
# Z motors are 17HS4401 on a belted Z (no reduction), so they hold the
# gantry's weight at standstill and are never disabled (macros/motors.cfg).

[stepper_z]
step_pin: PA5
dir_pin: PA4
enable_pin: !PA6
microsteps: 64
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 150
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PA3
interpolate: False
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PC5
dir_pin: !PC4
enable_pin: !PB0
microsteps: 64
rotation_distance: 40

[tmc2209 stepper_z1]
uart_pin: PA7
interpolate: False
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 999999

# Autotune sets chopper/PWM for silence
[autotune_tmc stepper_z]
motor: oukeda-17hs4401
voltage: 24
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: oukeda-17hs4401
voltage: 24
tuning_goal: silent
