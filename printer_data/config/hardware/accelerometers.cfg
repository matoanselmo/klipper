# ---------------- ACCELEROMETERS / INPUT SHAPING ----------------
# Shaper results live in the SAVE_CONFIG block.

[adxl345]
cs_pin: ebb:PB12
spi_software_sclk_pin: ebb:PB10
spi_software_mosi_pin: ebb:PB11
spi_software_miso_pin: ebb:PB2
axes_map: x, z, -y   # board upright on back of toolhead, USB-C up (measured)

[lis2dw bed]
cs_pin: btt_lis2dw:gpio9
spi_software_sclk_pin: btt_lis2dw:gpio10
spi_software_mosi_pin: btt_lis2dw:gpio11
spi_software_miso_pin: btt_lis2dw:gpio8
axes_map: -y, x, z  # flat on the bed: chip +x = bed +Y, chip +z = up (measured 2026-10-11)

# Toolhead ADXL measures X; the bed-mounted LIS2DW measures Y (bed-slinger).
[resonance_tester]
accel_chip_x: adxl345
accel_chip_y: adxl345
probe_points: 90, 50, 20   # centre of travel, 20 mm up
