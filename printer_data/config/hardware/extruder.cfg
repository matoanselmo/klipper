# ---------------- EXTRUDER ----------------
# Bowden, not direct drive: motor is wired to the EBB but feeds through a tube
# (hence PA 0.35 and 4 mm retraction). PID lives in the SAVE_CONFIG block.

[extruder]
step_pin: ebb:PD0
dir_pin: !ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.67
gear_ratio: 3:1
max_extrude_only_distance: 800
max_extrude_cross_section: 5
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.35
heater_pin: ebb:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: ebb:PA3
min_temp: -200
max_temp: 300
min_extrude_temp: 200

[tmc2209 extruder]
uart_pin: ebb:PA15
interpolate: True
run_current: 0.8
driver_IHOLDDELAY: 8
sense_resistor: 0.110

[firmware_retraction]
retract_length: 4
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35
