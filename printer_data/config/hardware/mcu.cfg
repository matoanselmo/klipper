# ---------------- CONTROLLERS ----------------
# FLY-DP5 mainboard and EBB toolhead board over CAN, S2DW accelerometer over USB.

[mcu]
canbus_uuid: efd592e09dd8

[mcu ebb]
canbus_uuid: 69f9e88e88cc

# BTT S2DW (RP2040 + LIS2DW) on the bed
[mcu btt_lis2dw]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340418AE361C-if00
is_non_critical: true

[temperature_sensor dp5_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor ebb_mcu]
sensor_type: temperature_mcu
sensor_mcu: ebb
