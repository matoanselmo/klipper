# ---------------- BED: HEATER, PROBE, LEVELING ----------------
# PID, z_offset and the default mesh live in the SAVE_CONFIG block.

[heater_bed]
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PC1
min_temp: -200
max_temp: 90

[bltouch]
sensor_pin: ^ebb:PB8
control_pin: ebb:PB9
x_offset: -42
y_offset: 0
samples: 2
samples_tolerance: 0.02
samples_tolerance_retries: 3

[z_tilt]
z_positions:
    260, 45
    -30, 45
points:
    20, 95
    185, 95
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0300

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 20
mesh_max: 127, 180
probe_count: 10, 10
adaptive_margin: 5
algorithm: bicubic
fade_start: 1
fade_end: 10
