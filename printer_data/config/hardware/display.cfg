# ---------------- DISPLAY ----------------
# MKS 14-pin screen on FLY-DP5 (EXP1 + EXP2 split cable).
# Screen RST (pin 4) intentionally not connected. M300 is in macros/ui.cfg.

[display]
lcd_type: st7920
# Mapping from Klipper's MKS Robin Lite LCD12864 config
cs_pin: PA13                  # screen pin 1
sclk_pin: PA14                # screen pin 7
sid_pin: PC11                 # screen pin 3
encoder_pins: ^PB6, ^PC12     # screen pins 6 and 8
click_pin: ^!PA15             # screen pin 5 (encoder button)

[output_pin beeper]
pin: PC10                     # screen pin 14
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
