# Docs: https://github.com/Clon1998/mobileraker_companion
# eta_format needs % escaped as %%

[general]
language: en
timezone: UTC
eta_format: %%d.%%m.%%Y, %%H:%%M:%%S
include_snapshot: True

[printer Mimi3D]
moonraker_uri: ws://127.0.0.1:1803/websocket
moonraker_api_key: False
snapshot_uri: http://127.0.0.1/webcam/?action=snapshot
snapshot_rotation: 0
ignore_filament_sensors:
