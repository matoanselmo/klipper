[gcode_macro PRINT_START]
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(210)|float %}
    {% set soak_time = params.SOAK|default(120)|int %}

    SET_LED_EFFECT EFFECT=drivers_loading REPLACE=1

    G28

    PREVIEW_PRINT_AREA

    # Change LED effect to heating
    SET_LED_EFFECT EFFECT=drivers_heating_bed REPLACE=1

    # Start heating bed toward target, don't block yet
    M140 S{bed_temp}

    # Move to a safe waiting position while heating
    G90
    G1 X100 Y100 Z20 F6000

    # Wait for bed to actually reach target temp
    M190 S{bed_temp}

    # Soak so the bed actually equalizes, not just hits target at the sensor
    G4 P{soak_time * 1000}

    # Bring hotend up partway to avoid oozing during mesh probing
    M104 S150

    SET_LED_EFFECT EFFECT=drivers_loading REPLACE=1

    # Fresh adaptive mesh every print, only under the objects.
    # Separate profile so SAVE_CONFIG never overwrites the full "default" mesh.
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5 PROFILE=adaptive

    SET_LED_EFFECT EFFECT=drivers_heating_extruder REPLACE=1

    # Now bring hotend to full temp and wait
    M109 S{extruder_temp}

    SET_LED_EFFECT EFFECT=drivers_progress REPLACE=1

    # Purge line
    M82
    G92 E0
    G1 X20 Y20 Z0.3 F3000
    G1 X20 Y80 E15 F600
    G1 X20.4 Y80 F3000
    G1 X20.4 Y20 E30 F800
    G92 E0

[gcode_macro PRINT_END]
gcode:
    # Relative extrusion and positioning for the retract below
    M83
    G91

    # Retract a bit to avoid oozing/stringing on the finished part
    G1 E-2 F1800

    # Raise Z relative to current position, capped at max travel
    {% set z_max = printer.toolhead.axis_maximum.z %}
    {% set current_z = printer.toolhead.position.z %}
    {% set z_lift = [current_z + 10, z_max]|min %}

    G90
    G1 Z{z_lift} F600

    # Move to back of bed for easy part removal
    G1 X100 Y150 F6000

    # Turn off heaters
    M104 S0
    M140 S0

    # Turn off part cooling fan
    M106 S0

    # Release X, Y and extruder (M84 is Z-safe, see Z HOLD below)
    M84

    # Clear any exclude_object state from this print
    EXCLUDE_OBJECT_RESET

    {action_respond_info("Print complete")}

    SET_LED_EFFECT EFFECT=drivers_complete REPLACE=1
    UPDATE_DELAYED_GCODE ID=return_to_idle DURATION=30

# ---------------- MAINSAIL PAUSE / CANCEL ----------------
# Overrides the defaults in mainsail.cfg (read-only). Park spot and lift
# match PRINT_END; retraction uses [firmware_retraction] (G10/G11).
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 100.0
variable_custom_park_y    : 150.0
variable_custom_park_dz   : 10.0
variable_park_at_cancel   : True
variable_use_fw_retract   : True
variable_user_cancel_macro: "_ON_CANCEL"
gcode:

# Runs inside Mainsail's CANCEL_PRINT (after park, retract and heaters off)
[gcode_macro _ON_CANCEL]
gcode:
    M84
    SET_LED_EFFECT EFFECT=drivers_idle REPLACE=1

[gcode_macro PREVIEW_PRINT_AREA]
description: Traces the bounding box of all labeled objects
gcode:
    {% set z_hop = params.Z_HOP|default(10)|float %}
    {% set speed = params.SPEED|default(6000)|int %}
    {% set margin = params.MARGIN|default(0)|float %}

    {% set objs = printer.exclude_object.objects %}

    {% if objs|length == 0 %}
        {action_respond_info("No labeled objects found, enable 'label objects' in your slicer")}
    {% else %}
        # Walk every object's polygon and track the extremes
        {% set ns = namespace(x_min=9999, x_max=-9999, y_min=9999, y_max=-9999) %}
        {% for obj in objs %}
            {% for point in obj.polygon %}
                {% set ns.x_min = [ns.x_min, point[0]]|min %}
                {% set ns.x_max = [ns.x_max, point[0]]|max %}
                {% set ns.y_min = [ns.y_min, point[1]]|min %}
                {% set ns.y_max = [ns.y_max, point[1]]|max %}
            {% endfor %}
        {% endfor %}

        # Apply margin and clamp to machine limits
        {% set ax_min = printer.toolhead.axis_minimum %}
        {% set ax_max = printer.toolhead.axis_maximum %}
        {% set x1 = [ns.x_min - margin, ax_min.x]|max %}
        {% set x2 = [ns.x_max + margin, ax_max.x]|min %}
        {% set y1 = [ns.y_min - margin, ax_min.y]|max %}
        {% set y2 = [ns.y_max + margin, ax_max.y]|min %}

        SAVE_GCODE_STATE NAME=preview_state
        G90
        G1 Z{z_hop} F600
        G1 X{x1} Y{y1} F{speed}
        G1 X{x2} Y{y1} F{speed}
        G1 X{x2} Y{y2} F{speed}
        G1 X{x1} Y{y2} F{speed}
        G1 X{x1} Y{y1} F{speed}
        RESTORE_GCODE_STATE NAME=preview_state
    {% endif %}

[delayed_gcode return_to_idle]
gcode:
    SET_LED_EFFECT EFFECT=drivers_idle REPLACE=1

# ---------------- Z HOLD ----------------
# The Z gantry drops when unpowered, so Z is never turned off:
# both Z motors are energised at boot, and M84/M18 (also used by
# idle_timeout, Mainsail's motors-off button and PRINT_END) only
# release X, Y and the extruder. M84.1 is the real all-motors-off.

[delayed_gcode hold_z_at_boot]
initial_duration: 1
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1

[gcode_macro M84]
description: Motors off except Z (Z stays held so the gantry can't drop)
rename_existing: M84.1
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    # X/Y may be moved by hand now: forget their homing, keep Z's
    SET_KINEMATIC_POSITION SET_HOMED=none CLEAR_HOMED=xy

[gcode_macro M18]
description: Same as M84 (Z stays held)
rename_existing: M18.1
gcode:
    M84