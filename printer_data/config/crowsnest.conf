# Docs: https://github.com/mainsail-crew/crowsnest/blob/v5/README.md
# Port 8080 = /webcam/, 8081 = /webcam2/, ...

[crowsnest]
log_level: verbose
rollover_on_start: false
no_proxy: false

[cam 1]
mode: ustreamer
port: 18031
device: /dev/video0
resolution: 1280x720
v4l2ctl: auto_exposure=0,exposure_dynamic_framerate=0,exposure_time_absolute=100
max_fps: 30
