#
# Configured for 24v PSU
# Total 360w power.
#

[include mainsail.cfg]
[include timelapse.cfg]
[include macros.cfg]
[include leds.cfg]
[include display.cfg]

[exclude_object]

[mcu]
canbus_uuid=efd592e09dd8

[mcu ebb]
canbus_uuid=69f9e88e88cc

# BTT S2DW (RP2040 + LIS2DW) on the bed, over USB
[mcu btt_lis2dw]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340418AE361C-if00
is_non_critical: true

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 600
gcode:
    {% if not printer.pause_resume.is_paused %}
        M84
        UPDATE_DELAYED_GCODE ID=heaters_off_when_idle DURATION=270
    {% endif %}

[temperature_sensor dp5_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor ebb_mcu]
sensor_type: temperature_mcu
sensor_mcu: ebb

[adxl345]
cs_pin: ebb:PB12
spi_software_sclk_pin: ebb:PB10
spi_software_mosi_pin: ebb:PB11
spi_software_miso_pin: ebb:PB2
axes_map: x, z, -y   # board upright on back of toolhead, USB-C up (measured)

#[lis2dw bed]
#cs_pin: btt_lis2dw:gpio9
#spi_software_sclk_pin: btt_lis2dw:gpio10
#spi_software_mosi_pin: btt_lis2dw:gpio11
#spi_software_miso_pin: btt_lis2dw:gpio8
#axes_map: -y, x, z  # flat on the bed: chip +x = bed +Y, chip +z = up (measured 2026-10-11)

# ---------------- RESONANCE TESTER ----------------
# Toolhead ADXL measures X; the bed-mounted LIS2DW measures Y (bed-slinger).
[resonance_tester]
accel_chip_x: adxl345
accel_chip_y: adxl345
probe_points: 90, 50, 20   # centre of travel, 20 mm up

# ---------------- X AXIS (sensorless homing, negative direction) ----------------
[stepper_x]
step_pin: PC15
dir_pin: !PC14
enable_pin: !PC2
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5
position_max: 185
position_endstop: -5
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.58
sense_resistor: 0.110
diag_pin: PB4
driver_SGTHRS: 100
stealthchop_threshold: 999999

# ---------------- Y AXIS (sensorless homing, negative direction) ----------------
[stepper_y]
step_pin = PA1
dir_pin = !PA0
enable_pin = !PA2
microsteps = 16
rotation_distance = 40
endstop_pin = tmc2209_stepper_y:virtual_endstop
position_endstop = -50
position_min = -50
position_max = 180
homing_speed = 30
homing_retract_dist = 0

[tmc2209 stepper_y]
uart_pin = PC3
run_current = 1.2
sense_resistor = 0.110
stealthchop_threshold = 999999
diag_pin = ^PB3
driver_sgthrs = 50

# ---------------- Z AXIS ----------------
[stepper_z]
step_pin: PA5
dir_pin: PA4
enable_pin: !PA6
microsteps: 64
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 150
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PA3
interpolate: False
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PC5
dir_pin: !PC4
enable_pin: !PB0
microsteps: 64
rotation_distance: 40

[tmc2209 stepper_z1]
uart_pin: PA7
interpolate: False
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 999999

# Z motors are 17HS4401 on a belted Z (no reduction), so they hold the
# gantry's weight at standstill. Autotune sets chopper/PWM for silence.
[autotune_tmc stepper_z]
motor: oukeda-17hs4401
voltage: 24
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: oukeda-17hs4401
voltage: 24
tuning_goal: silent

# ---------------- EXTRUDER ----------------
# Bowden, not direct drive: motor is wired to the EBB but feeds through a tube
# (hence PA 0.35 and 4 mm retraction).
[extruder]
step_pin: ebb:PD0
dir_pin: !ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.67
max_extrude_only_distance: 800
max_extrude_cross_section: 5
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.35
gear_ratio: 3:1
heater_pin: ebb:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: ebb:PA3
min_temp: -200
max_temp: 300
min_extrude_temp: 200

[tmc2209 extruder]
uart_pin: ebb:PA15
interpolate:true
run_current: 0.8
driver_IHOLDDELAY: 8
sense_resistor: 0.110

# ---------------- RETRACTION ----------------
[firmware_retraction]
retract_length: 4
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

# ---------------- Z TILT ADJUST -------------------
[z_tilt]
z_positions:
    260, 45
    -30, 45
points:
    20, 95
    185, 95
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0300

# ---------------- BED HEATER ----------------
[heater_bed]
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PC1
min_temp: -200
max_temp: 90

# ---------------- FANS ----------------
[fan]
pin: ebb:PA0
kick_start_time: 0.100
min_power: 0.15

[heater_fan hotend_fan]
pin: ebb:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 0.0

[controller_fan controller_fan]
pin: PC9
kick_start_time: 0
fan_speed: 0.6
idle_timeout: 60
idle_speed: 0.0
# Z is always energised (gantry hold), so its drivers always need airflow
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, extruder

# ---------------- PROBE ----------------
[bltouch]
sensor_pin: ^ebb:PB8
control_pin: ebb:PB9
x_offset: -42
y_offset: 0
samples: 2
samples_tolerance: 0.02
samples_tolerance_retries: 3

# ---------------- BED MESH -------------------
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 20
mesh_max: 127, 180
probe_count: 10, 10
adaptive_margin: 5
algorithm: bicubic
fade_start: 1
fade_end: 10

