# MKS 14-pin screen on FLY-DP5 (EXP1 + EXP2 split cable)
# Add [include display.cfg] to printer.cfg
# Screen RST (pin 4) intentionally not connected

[display]
lcd_type: st7920
# Mapping from Klipper's MKS Robin Lite LCD12864 config
cs_pin: PA13            # screen pin 1
sclk_pin: PA14          # screen pin 7
sid_pin: PC11           # screen pin 3
encoder_pins: ^PB6, ^PC12     # screen pins 6 and 8
click_pin: ^!PA15             # screen pin 5 (encoder button)

[output_pin beeper]
pin: PC10               # screen pin 14
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0