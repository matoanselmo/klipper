# ---------------- PRINT START / END / CANCEL ----------------
# Slicer start gcode: PRINT_START BED_TEMP=.. EXTRUDER_TEMP=.. [SOAK=s]

[gcode_macro PRINT_START]
description: Home, heat, soak, level, mesh, purge
gcode:
    {% set cfg = printer["gcode_macro _CFG"] %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(210)|float %}
    {% set soak_s = params.SOAK|default(cfg.soak_s)|int %}

    _STATUS_LED STATE=loading
    G90

    # Full X current for printing; re-home X so any shift from the current
    # change is cancelled out (homing keeps whatever current was active)
    _SET_CURRENT STEPPERS=stepper_x LEVEL=run
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %}
        G28 X
    {% endif %}

    PREVIEW_PRINT_AREA

    # Heat the bed, warm the hotend only partway (safe for probing, no ooze)
    _STATUS_LED STATE=heating_bed
    M140 S{bed_temp}
    M104 S{cfg.probe_nozzle}
    SMART_PARK
    M190 S{bed_temp}

    # Soak so the bed actually equalizes, not just hits target at the sensor
    G4 P{soak_s * 1000}

    # Re-home Z and level now that the bed and frame have expanded
    _STATUS_LED STATE=loading
    G28 Z
    Z_TILT_ADJUST

    # Fresh adaptive mesh every print, only under the objects.
    # Separate profile so SAVE_CONFIG never overwrites the full "default" mesh.
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=adaptive

    # Final heat parked next to the print area so ooze stays off the parts
    SMART_PARK
    _STATUS_LED STATE=heating_extruder
    M109 S{extruder_temp}

    _STATUS_LED STATE=printing
    G1 Z2.0 F3000
    M_PURGE

[gcode_macro PRINT_END]
description: Retract, lift, park (same spot as cancel), heaters and motors off
gcode:
    {% set park = printer["gcode_macro _CLIENT_VARIABLE"] %}
    {% set z_lift = [printer.toolhead.position.z + park.custom_park_dz, printer.toolhead.axis_maximum.z]|min %}

    # Retract a bit to avoid oozing/stringing on the finished part
    M83
    G1 E-2 F1800

    G90
    G1 Z{z_lift} F600
    G1 X{park.custom_park_x} Y{park.custom_park_y} F6000

    M104 S0
    M140 S0
    M106 S0
    M84                       ; Z stays held, see motors.cfg
    EXCLUDE_OBJECT_RESET

    {action_respond_info("Print complete")}
    _AFTER_PRINT LED=complete

# Runs inside Mainsail's CANCEL_PRINT (after park, retract and heaters off)
[gcode_macro _ON_CANCEL]
gcode:
    M84
    _AFTER_PRINT LED=idle

[gcode_macro _AFTER_PRINT]
description: Shared tail of PRINT_END and cancel: X back to idle current, LED status
gcode:
    _SET_CURRENT STEPPERS=stepper_x LEVEL=idle
    _STATUS_LED STATE={params.LED}
    {% if params.LED != 'idle' %}
        UPDATE_DELAYED_GCODE ID=_LED_BACK_TO_IDLE DURATION=30
    {% endif %}
