# ---------------- MOTORS: CURRENTS & Z HOLD ----------------
# The Z gantry drops when unpowered, so Z is never turned off:
# both Z motors are energised at boot, and M84/M18 (also used by
# idle_timeout, Mainsail's motors-off button and PRINT_END) only
# release X, Y and the extruder. M84.1 is the real all-motors-off.
#
# Outside prints X and Z run at the reduced _CFG.idle_current (less driver
# heat, quieter Z hold). Homing raises Z to run current; PRINT_START raises X.

# Remembers the intended level per stepper so homing can restore it even if
# a previous homing attempt failed while the driver was on homing current.
# Steppers without a level_* variable (Y) are always at run current.
[gcode_macro _SET_CURRENT]
description: Set STEPPERS (comma list) to LEVEL=run (hardware run_current) or LEVEL=idle (_CFG)
variable_level_stepper_x: 'run'
variable_level_stepper_z: 'run'
variable_level_stepper_z1: 'run'
gcode:
    {% set level = params.LEVEL|lower %}
    {% if level not in ('run', 'idle') %}
        { action_raise_error("_SET_CURRENT: LEVEL must be run or idle") }
    {% endif %}
    {% for stepper in params.STEPPERS.split(',') %}
        {% set cur = printer.configfile.settings['tmc2209 ' ~ stepper].run_current if level == 'run' else printer["gcode_macro _CFG"].idle_current[stepper] %}
        SET_TMC_CURRENT STEPPER={stepper} CURRENT={cur}
        {% if ('level_' ~ stepper) in printer["gcode_macro _SET_CURRENT"] %}
            SET_GCODE_VARIABLE MACRO=_SET_CURRENT VARIABLE=level_{stepper} VALUE="'{level}'"
        {% endif %}
    {% endfor %}

[delayed_gcode _HOLD_Z_AT_BOOT]
initial_duration: 1
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    _SET_CURRENT STEPPERS=stepper_x,stepper_z,stepper_z1 LEVEL=idle

[gcode_macro M84]
description: Motors off except Z (Z stays held so the gantry can't drop)
rename_existing: M84.1
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    # X/Y may be moved by hand now: forget their homing, keep Z's
    SET_KINEMATIC_POSITION SET_HOMED=none CLEAR_HOMED=xy
    _SET_CURRENT STEPPERS=stepper_z,stepper_z1 LEVEL=idle

[gcode_macro M18]
description: Same as M84 (Z stays held)
rename_existing: M18.1
gcode:
    M84
