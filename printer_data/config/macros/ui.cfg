# ---------------- UI: LEDS & BEEPER ----------------

[gcode_macro _STATUS_LED]
description: Show STATE on the driver LEDs (idle, loading, heating_bed, heating_extruder, printing, complete)
gcode:
    SET_LED_EFFECT EFFECT=drivers_{params.STATE|lower} REPLACE=1

[delayed_gcode _LED_BACK_TO_IDLE]
gcode:
    _STATUS_LED STATE=idle

[gcode_macro M300]
description: Beep. S=frequency (Hz) P=duration (ms)
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0
