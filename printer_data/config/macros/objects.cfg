# ---------------- PRINT-AREA AWARE MOVES ----------------
# All of these use the objects the slicer labels (EXCLUDE_OBJECT_DEFINE).
# Every vertex of every object, flattened into one list:
#   printer.exclude_object.objects | selectattr('polygon', 'defined')
#       | map(attribute='polygon') | sum(start=[])

[gcode_macro PREVIEW_PRINT_AREA]
description: Traces the bounding box of all labeled objects
gcode:
    {% set z_hop = params.Z_HOP|default(10)|float %}
    {% set speed = params.SPEED|default(6000)|int %}
    {% set margin = params.MARGIN|default(0)|float %}
    {% set pts = printer.exclude_object.objects | selectattr('polygon', 'defined') | map(attribute='polygon') | sum(start=[]) %}

    {% if pts|length == 0 %}
        {action_respond_info("No labeled objects found, enable 'label objects' in your slicer")}
    {% else %}
        # Bounding box plus margin, clamped to machine limits
        {% set ax_min = printer.toolhead.axis_minimum %}
        {% set ax_max = printer.toolhead.axis_maximum %}
        {% set x1 = [(pts | map(attribute=0) | min) - margin, ax_min.x]|max %}
        {% set x2 = [(pts | map(attribute=0) | max) + margin, ax_max.x]|min %}
        {% set y1 = [(pts | map(attribute=1) | min) - margin, ax_min.y]|max %}
        {% set y2 = [(pts | map(attribute=1) | max) + margin, ax_max.y]|min %}

        SAVE_GCODE_STATE NAME=preview_state
        G90
        G1 Z{z_hop} F600
        G1 X{x1} Y{y1} F{speed}
        G1 X{x2} Y{y1} F{speed}
        G1 X{x2} Y{y2} F{speed}
        G1 X{x1} Y{y2} F{speed}
        G1 X{x1} Y{y1} F{speed}
        RESTORE_GCODE_STATE NAME=preview_state
    {% endif %}

[gcode_macro SMART_PARK]
description: Parks the printhead just in front of/left of the print area
gcode:
    {% set z_height = 10.0 %}   ; Park height
    {% set margin = 10.0 %}     ; Distance from the objects' min corner

    {% set ax_min = printer.toolhead.axis_minimum %}
    {% set ax_max = printer.toolhead.axis_maximum %}
    {% set pts = printer.exclude_object.objects | selectattr('polygon', 'defined') | map(attribute='polygon') | sum(start=[]) %}

    {% if pts|length > 0 %}
        {% set x = [(pts | map(attribute=0) | min) - margin, ax_min.x]|max %}
        {% set y = [(pts | map(attribute=1) | min) - margin, ax_min.y]|max %}
    {% else %}
        # No labeled objects: park at the bed centre
        {% set x = ax_max.x / 2 %}
        {% set y = ax_max.y / 2 %}
    {% endif %}

    SAVE_GCODE_STATE NAME=smart_park_state
    G90
    {% if printer.toolhead.position.z < z_height %}
        G1 Z{z_height} F900
    {% endif %}
    G1 X{x} Y{y} F{printer.toolhead.max_velocity * 60}
    G1 Z{z_height} F900
    RESTORE_GCODE_STATE NAME=smart_park_state

[gcode_macro M_PURGE]
description: Purges filament in a compact 8x8mm M shape just in front of the print area
gcode:
    # 1. Geometry and extrusion settings
    {% set width = 8.0 %}       ; Total width of the M
    {% set height = 8.0 %}      ; Total height of the M
    {% set gap = 4.0 %}         ; Clearance between the M and the objects
    {% set wipe = 4.0 %}        ; Length of the wipe off the right leg
    {% set z_height = 0.28 %}   ; First layer purge height
    {% set feed_rate = 600 %}   ; 10mm/s, ~6mm3/s so the hotend can keep up
    {% set purge_mult = 0.7 %}  ; Keep under Klipper's default max_extrude_cross_section
    {% set prime_len = 10.0 %}  ; Refills the nozzle after the last retract (Bowden lag)
    {% set fallback = [110.0, 10.0] %}

    {% set ax_min = printer.toolhead.axis_minimum %}
    {% set ax_max = printer.toolhead.axis_maximum %}
    {% set pts = printer.exclude_object.objects | selectattr('polygon', 'defined') | map(attribute='polygon') | sum(start=[]) %}

    # 2. Pick a start point
    #    Manual PURGE_X/PURGE_Y wins, then in front of the objects,
    #    then to the left of them, then a fixed fallback.
    {% if 'PURGE_X' in params and 'PURGE_Y' in params %}
        {% set x0 = params.PURGE_X|float %}
        {% set y0 = params.PURGE_Y|float %}
    {% elif pts|length > 0 %}
        {% set obj_x = pts | map(attribute=0) | min %}
        {% set obj_y = pts | map(attribute=1) | min %}

        {% if obj_y - height - gap >= ax_min.y + 1 %}
            # Room in front of the objects
            {% set x0 = [obj_x, ax_min.x + 1]|max %}
            {% set y0 = obj_y - height - gap %}
        {% elif obj_x - width - gap - wipe >= ax_min.x + 1 %}
            # No room in front, go to the left instead
            {% set x0 = obj_x - width - gap - wipe %}
            {% set y0 = [obj_y, ax_min.y + 1]|max %}
        {% else %}
            # Objects hug the front-left corner, use the front edge
            {% set x0 = [obj_x, ax_min.x + 1]|max %}
            {% set y0 = ax_min.y + 1 %}
        {% endif %}
    {% else %}
        {% set x0 = fallback[0] %}
        {% set y0 = fallback[1] %}
    {% endif %}

    # Keep the M and its wipe inside the bed
    {% set x0 = [x0, ax_max.x - width - wipe - 1]|min %}
    {% set y0 = [y0, ax_max.y - height - 1]|min %}

    # 3. Path coordinates relative to the start point
    {% set x2 = x0 + (width * 0.5) %}
    {% set x4 = x0 + width %}
    {% set y_top = y0 + height %}
    {% set y_mid = y0 + (height * 0.4) %} ; Middle point of the M

    # 4. Draw the "M"
    G90                             ; Absolute positioning
    M83                             ; Relative extrusion (E values below are per segment)
    G92 E0
    G1 X{x0} Y{y0} F6000            ; Move to start point (bottom left)
    G1 Z{z_height} F1500            ; Drop to purge layer height
    G11
    G1 E{prime_len} F300            ; Prime so the first leg isn't starved

    G1 X{x0} Y{y_top} E{height * 0.35 * purge_mult} F{feed_rate}     ; Left leg up
    G1 X{x2} Y{y_mid} E{height * 0.3 * purge_mult} F{feed_rate}      ; Left diagonal down
    G1 X{x4} Y{y_top} E{height * 0.3 * purge_mult} F{feed_rate}      ; Right diagonal up
    G1 X{x4} Y{y0} E{height * 0.35 * purge_mult} F{feed_rate}        ; Right leg down

    # 5. Clean retraction and wipe
    G1 E-0.8 F3000                        ; Light retraction to prevent stringing
    G1 X{x4 + wipe} Y{y0 + 2} F6000       ; Diagonal wipe to snap the filament line
    G92 E0
