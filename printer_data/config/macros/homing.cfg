# ---------------- HOMING ----------------
# G28 [X] [Y] [Z]: Z hop -> X -> Y -> Z on the probe -> park.
# X and Y are sensorless and rammed _CFG.home_passes times (like the Prusa
# Core One); only the last ram sets the position.

[homing_override]
axes: xyz
gcode:
    {% set cfg = printer["gcode_macro _CFG"] %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set do_x = home_all or 'X' in params %}
    {% set do_y = home_all or 'Y' in params %}
    {% set do_z = home_all or 'Z' in params %}
    {% set xy_known = (do_x or 'x' in homed) and (do_y or 'y' in homed) %}

    {% if do_z and not xy_known %}
        { action_raise_error("Home X and Y before homing Z") }
    {% endif %}

    _SET_CURRENT STEPPERS=stepper_z,stepper_z1 LEVEL=run
    _HOMING_Z_HOP

    {% if do_x %}
        _HOME_SENSORLESS AXIS=X
    {% endif %}
    {% if do_y %}
        _HOME_SENSORLESS AXIS=Y
    {% endif %}

    {% if do_z %}
        G90
        G1 X{cfg.home_z_xy[0]} Y{cfg.home_z_xy[1]} F{cfg.travel_feed}
        G28 Z
        G1 Z{cfg.home_z_hop} F900
    {% endif %}

    {% if xy_known %}
        G90
        G1 X{cfg.home_park_xy[0]} Y{cfg.home_park_xy[1]} F{cfg.travel_feed}
    {% endif %}

[gcode_macro _HOMING_Z_HOP]
description: Lift the nozzle clear of the bed before homing X/Y
gcode:
    {% set hop = printer["gcode_macro _CFG"].home_z_hop %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        # Z unknown: pretend we're at 0 just long enough to move up
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=z
        G91
        G1 Z{hop} F900
        G90
        SET_KINEMATIC_POSITION SET_HOMED=none CLEAR_HOMED=z
    {% elif printer.toolhead.position.z < hop %}
        G90
        G1 Z{hop} F900
    {% endif %}

[gcode_macro _HOME_SENSORLESS]
description: Home one sensorless axis (AXIS=X|Y) at reduced current, ramming it several times
gcode:
    {% set cfg = printer["gcode_macro _CFG"] %}
    {% set axis = params.AXIS|upper %}
    {% set stepper = 'stepper_' ~ axis|lower %}
    # Go back to the intended level (idle or run). Not read from the driver:
    # after a failed home it would still be on homing current.
    {% set restore = printer["gcode_macro _SET_CURRENT"]['level_' ~ stepper]|default('run') %}

    SET_TMC_CURRENT STEPPER={stepper} CURRENT={cfg.home_current[stepper]}
    {% for i in range(cfg.home_passes) %}
        G28 {axis}
        G90
        G1 {axis}{cfg.home_backoff} F6000
        G4 P{cfg.home_settle_ms}
    {% endfor %}
    _SET_CURRENT STEPPERS={stepper} LEVEL={restore}
