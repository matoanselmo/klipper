[gcode_macro _CFG]
description: Shared macro settings (not a command)
# Sensorless homing (macros/homing.cfg)
variable_home_current:   {'stepper_x': 0.45, 'stepper_y': 0.80}   ; A while ramming
variable_home_passes:    2      ; rams per axis, the last one sets the position
variable_home_backoff:   10     ; mm, position to back off to after each ram
variable_home_settle_ms: 500    ; pause so StallGuard resets before the next ram
variable_home_z_hop:     10     ; mm, lift before homing X/Y and after homing Z
variable_home_z_xy:      [88, 150]   ; nozzle position for G28 Z (probe is 60 mm in front)
variable_home_park_xy:   [88, 105]    ; where the head waits after homing
variable_travel_feed:    12000       ; mm/min

# Reduced currents outside prints (macros/motors.cfg). Run current = hardware/
variable_idle_current: {'stepper_x': 0.35, 'stepper_z': 0.40, 'stepper_z1': 0.40}   ; A, raise Z if the gantry creeps down

# PRINT_START defaults
variable_soak_s:         120    ; bed soak after reaching temp
variable_probe_nozzle:   150    ; hotend temp while probing (no ooze)
variable_purge_gap:      12     ; mm between the M and the objects, keep it above brim width

# Idle: heaters go off this long after the motors-off idle timeout
variable_heaters_off_delay_s: 270
gcode: