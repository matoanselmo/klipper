# ---------------- IDLE ----------------
# After 10 min idle: motors off (Z stays held), then heaters off
# _CFG.heaters_off_delay_s later unless something happened in between.

[idle_timeout]
timeout: 600
gcode:
    {% if not printer.pause_resume.is_paused %}
        M84
        UPDATE_DELAYED_GCODE ID=_HEATERS_OFF_WHEN_IDLE DURATION={printer["gcode_macro _CFG"].heaters_off_delay_s}
    {% endif %}

# Skipped if the printer left "Idle" since; the next idle timeout reschedules it.
[delayed_gcode _HEATERS_OFF_WHEN_IDLE]
gcode:
    {% if printer.idle_timeout.state == "Idle" and not printer.pause_resume.is_paused %}
        TURN_OFF_HEATERS
    {% endif %}
