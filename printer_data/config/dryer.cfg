[gcode_macro DRY_FILAMENT]
description: Dry filament using box air temp. DRY_FILAMENT MATERIAL=PETG HOURS=5 [TEMP=xx] [BED_MAX=xx]
variable_remaining: 0
variable_target: 0
variable_bed_max: 0
gcode:
    # material: [air target, bed max]
    {% set presets = {
        "PLA":   [45, 55],
        "TPU":   [45, 60],
        "PETG":  [60, 70],
        "ABS":   [70, 90],
        "ASA":   [70, 90],
        "NYLON": [70, 90],
        "PC":    [70, 90]
    } %}
    {% set material = params.MATERIAL|default("PETG")|upper %}
    {% set p = presets.get(material, [0, 0]) %}
    {% set target = params.TEMP|default(p[0])|float %}
    {% set hours = params.HOURS|default(4)|float %}
    {% set minutes = (hours * 60)|int %}
    {% set bed_limit = printer.configfile.settings.heater_bed.max_temp - 5 %}
    {% set default_cap = p[1] if p[1] > 0 else target + 30 %}
    {% set bed_max = [params.BED_MAX|default(default_cap)|float, bed_limit]|min %}

    {% if target <= 0 %}
        {action_raise_error("Unknown material '%s'. Use one of %s or pass TEMP=" % (material, presets.keys()|list))}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=remaining VALUE={minutes}
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=bed_max VALUE={bed_max}
    SET_IDLE_TIMEOUT TIMEOUT={minutes * 60 + 600}
    M140 S{bed_max}
    {action_respond_info("Drying %s: air %dC, bed capped at %dC, %.1f hours. DRY_FILAMENT_STOP to cancel." % (material, target, bed_max, hours))}
    UPDATE_DELAYED_GCODE ID=DRY_FILAMENT_TICK DURATION=60

[delayed_gcode DRY_FILAMENT_TICK]
gcode:
    {% set m = printer["gcode_macro DRY_FILAMENT"] %}
    {% set air = printer["temperature_sensor dryer"].temperature %}
    {% set left = m.remaining - 1 %}
    {% if left > 0 %}
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=remaining VALUE={left}
        {% if air < m.target - 1 %}
            M140 S{m.bed_max}
        {% elif air > m.target + 1 %}
            M140 S{m.target}
        {% endif %}
        M117 Air {air|round(1)}C, {left // 60}h {left % 60}m left
        UPDATE_DELAYED_GCODE ID=DRY_FILAMENT_TICK DURATION=60
    {% else %}
        DRY_FILAMENT_STOP
    {% endif %}

[gcode_macro DRY_FILAMENT_STOP]
description: Stop filament drying and turn off the bed
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set idle = cfg.idle_timeout.timeout if "idle_timeout" in cfg else 600 %}
    UPDATE_DELAYED_GCODE ID=DRY_FILAMENT_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=remaining VALUE=0
    M140 S0
    SET_IDLE_TIMEOUT TIMEOUT={idle}
    M117 Drying done
    {action_respond_info("Filament drying finished, bed off.")}